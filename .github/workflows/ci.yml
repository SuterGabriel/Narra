name: CI

# Every push and pull request: lint, unit tests, citation check against the book, production build.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm ci rejects lockfiles written on Windows because optional wasm deps of
      # Tailwind's native binary are missing for Linux (npm/cli#4828). npm install
      # still honours the pinned versions in package-lock.json.
      - run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Verify every citation against the book text
        run: npm run check:content

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
